<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>The Prime Steakhouse - QR Men&uuml;</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --card: #1a2235;
            --text: #f3f4f6;
            --text-muted: #8892a4;
            --accent: #c9953c;
            --accent-subtle: rgba(201,149,60,0.12);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --success: #2d8a4e;
            --danger: #b91c1c;
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 8px;
            --font: 'Plus Jakarta Sans', 'Satoshi', system-ui, sans-serif;
            --pop: #dc2626;
            --vegan: #2d8a4e;
        }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 40px;
        }
        svg { display: inline-block; vertical-align: middle; flex-shrink: 0; }

        /* HEADER - glass effect */
        .header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(10,14,26,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
        }
        .header-inner {
            max-width: 960px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-logo {
            width: 40px; height: 40px; border-radius: var(--radius-sm);
            background: var(--accent-subtle);
            border: 1px solid rgba(201,149,60,0.25);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: var(--accent);
        }
        .header-logo svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
        .header-title span { color: var(--text-muted); font-weight: 400; }
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 100px; font-size: 12px; font-weight: 600;
            background: var(--accent-subtle); color: var(--accent);
            border: 1px solid rgba(201,149,60,0.2); flex-shrink: 0;
        }
        .badge svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

        /* HERO */
        .hero { max-width: 960px; margin: 0 auto; padding: 28px 20px 20px; text-align: center; }
        .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; color: var(--text); }
        .hero h1 span {
            background: linear-gradient(135deg, var(--accent), #e8b84c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }
        .hero h1 span.long-press { opacity: 0.7; transition: opacity 0.3s; }
        .hero p { color: var(--text-muted); font-size: 14px; }

        /* MENU ACCORDION */
        .menu { max-width: 960px; margin: 0 auto; padding: 4px 20px 20px; }

        .category-section {
            margin-bottom: 10px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
            scroll-margin-top: 80px;
        }
        .category-section:target { border-color: rgba(201,149,60,0.4); }

        .category-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px 14px 18px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s;
            position: sticky;
            top: 69px;
            z-index: 20;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .category-header:hover { background: rgba(255,255,255,0.03); }
        .category-section.collapsed .category-header { border-bottom-color: transparent; border-radius: var(--radius); }
        .category-header-left { display: flex; align-items: center; gap: 10px; }
        .category-header-icon {
            width: 32px; height: 32px; border-radius: var(--radius-xs);
            background: var(--accent-subtle);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent); flex-shrink: 0;
        }
        .category-header-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .category-header-icon svg.fill { fill: currentColor; }
        .category-header-name { font-size: 16px; font-weight: 700; color: var(--text); }
        .category-header-count {
            font-size: 11px; color: var(--text-muted);
            background: var(--bg); padding: 2px 10px; border-radius: 100px;
            font-weight: 600; min-width: 24px; text-align: center;
        }
        .category-header-toggle {
            color: var(--text-muted);
            transition: transform 0.3s ease;
            width: 20px; height: 20px;
        }
        .category-header-toggle svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .category-section.collapsed .category-header-toggle { transform: rotate(-90deg); }

        .category-items {
            display: grid; grid-template-columns: 1fr; gap: 6px;
            padding: 8px 12px 12px;
        }
        .category-section.collapsed .category-items { display: none; }

        .menu-item {
            display: flex; gap: 12px; padding: 12px;
            border-radius: var(--radius-sm);
            background: var(--card);
            border: 1px solid transparent;
            transition: border-color 0.25s ease;
            position: relative;
            animation: fadeIn 0.3s ease both;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .menu-item:hover { border-color: var(--border-hover); }
        .menu-item-img {
            width: 64px; height: 64px; border-radius: var(--radius-xs);
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            background: var(--surface); overflow: hidden; border: 1px solid var(--border);
        }
        .menu-item-img svg { width: 28px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .menu-item-img svg.fill { fill: var(--accent); }
        .menu-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .menu-item-body { flex: 1; min-width: 0; }
        .menu-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 1px; }
        .menu-item-name { font-size: 14px; font-weight: 600; color: var(--text); }
        .menu-item-price { font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
        .menu-item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-bottom: 5px; }
        .menu-item-tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 10px; border-radius: 100px;
            font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
        }
        .tag svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .tag svg.fill { fill: currentColor; }
        .tag-pop { background: rgba(220, 38, 38, 0.1); color: var(--pop); }
        .tag-vegan { background: rgba(45, 138, 78, 0.1); color: var(--success); }
        .tag-new { background: rgba(201, 149, 60, 0.12); color: var(--accent); }

        /* FOOTER */
        .footer { max-width: 960px; margin: 40px auto 0; padding: 24px 20px; border-top: 1px solid var(--border); text-align: center; position: relative; }
        .footer-info { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .footer-info a { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .footer-info a:hover { color: var(--accent); }
        .footer-social { display: flex; justify-content: center; gap: 10px; }
        .footer-social a {
            width: 38px; height: 38px; border-radius: 50%;
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); text-decoration: none;
            transition: all 0.25s ease;
        }
        .footer-social a:hover { border-color: var(--accent); color: var(--accent); }
        .footer-social a svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .footer-copy { margin-top: 14px; font-size: 12px; color: rgba(136,146,164,0.4); }

        @media (min-width: 600px) {
            .category-items { grid-template-columns: 1fr 1fr; gap: 8px; }
            .category-header { padding: 16px 20px 16px 22px; }
            .category-items { padding: 10px 16px 16px; }
            .hero h1 { font-size: 32px; }
            .menu-item-img { width: 72px; height: 72px; }
            .menu-item-img svg { width: 32px; height: 32px; }
        }

        /* ADMIN */
        .admin-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: var(--surface);
            border-top: 2px solid var(--accent);
            padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
        }
        .admin-bar .info { font-size: 13px; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .admin-bar .info svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .admin-bar .actions { display: flex; gap: 8px; }
        .admin-btn {
            padding: 8px 16px; border-radius: var(--radius-xs); border: none;
            font-family: var(--font); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .admin-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .admin-btn-primary { background: var(--accent); color: #0a0e1a; }
        .admin-btn-primary:hover { background: #dba44a; transform: translateY(-1px); }
        .admin-btn-danger { background: rgba(185, 28, 28, 0.15); color: var(--danger); }
        .admin-btn-danger:hover { background: rgba(185, 28, 28, 0.25); }
        .admin-btn-ghost { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
        .admin-btn-ghost:hover { border-color: var(--border-hover); color: var(--text); }

        .admin-controls {
            position: absolute; top: 8px; right: 8px;
            display: none; gap: 4px; z-index: 5;
        }
        .admin-controls button {
            width: 30px; height: 30px; border-radius: 6px;
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .admin-controls button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .admin-controls .edit-btn { background: rgba(201,149,60,0.12); color: var(--accent); }
        .admin-controls .edit-btn:hover { background: rgba(201,149,60,0.22); }
        .admin-controls .del-btn { background: rgba(185,28,28,0.1); color: var(--danger); }
        .admin-controls .del-btn:hover { background: rgba(185,28,28,0.2); }
        .admin-on .category-items { padding-right: 4px; }
        .admin-on .admin-controls { display: flex; }

        /* MODAL */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 24px 20px 28px;
            animation: modalUp 0.3s ease;
        }
        @keyframes modalUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text); display: flex; align-items: center; gap: 10px; }
        .modal h2 svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .modal label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; margin-top: 14px; }
        .modal label:first-of-type { margin-top: 0; }
        .modal input, .modal select, .modal textarea {
            width: 100%; padding: 10px 14px; border-radius: var(--radius-xs);
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-family: var(--font); font-size: 14px;
            outline: none; transition: border 0.2s;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
        .modal textarea { resize: vertical; min-height: 60px; }
        .modal .row { display: flex; gap: 12px; }
        .modal .row > * { flex: 1; }
        .modal .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
        .modal .modal-actions button {
            flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none;
            font-family: var(--font); font-size: 14px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .modal .modal-actions button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .modal .modal-actions .save-btn { background: var(--accent); color: #0a0e1a; }
        .modal .modal-actions .save-btn:hover { background: #dba44a; }
        .modal .modal-actions .cancel-btn { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
        .modal .modal-actions .cancel-btn:hover { border-color: var(--border-hover); color: var(--text); }

        .photo-upload { margin-top: 14px; }
        .photo-upload .preview-wrap {
            display: flex; align-items: center; gap: 12px; margin-top: 8px;
        }
        .photo-upload .preview {
            width: 72px; height: 72px; border-radius: var(--radius-sm);
            background: var(--bg); overflow: hidden; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; color: var(--text-muted);
        }
        .photo-upload .preview svg { width: 28px; height: 28px; stroke: var(--text-muted); fill: none; stroke-width: 1.6; }
        .photo-upload .preview img { width: 100%; height: 100%; object-fit: cover; }
        .photo-upload .upload-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: var(--bg); color: var(--text-muted); font-family: var(--font);
            font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .photo-upload .upload-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .photo-upload .upload-btn:hover { border-color: var(--border-hover); color: var(--text); }
        .photo-upload .clear-btn {
            padding: 6px 12px; border-radius: 6px; border: none;
            background: rgba(185,28,28,0.1); color: var(--danger);
            font-family: var(--font); font-size: 12px; cursor: pointer;
        }

        @media (min-width: 600px) {
            .modal-overlay { align-items: center; }
            .modal { border-radius: var(--radius); }
        }

        /* CATEGORY MODAL */
        .cat-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
        .cat-list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; border-radius: var(--radius-xs);
            background: var(--bg); border: 1px solid var(--border);
        }
        .cat-list-info { display: flex; align-items: center; gap: 10px; }
        .cat-list-icon {
            width: 32px; height: 32px; border-radius: 6px;
            background: var(--accent-subtle);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent); flex-shrink: 0;
        }
        .cat-list-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .cat-list-icon svg.fill { fill: currentColor; }
        .cat-list-name { font-size: 14px; font-weight: 600; color: var(--text); }
        .cat-list-count { font-size: 11px; color: var(--text-muted); }
        .cat-list-actions { display: flex; gap: 4px; }
        .cat-list-actions button {
            width: 30px; height: 30px; border-radius: 6px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .cat-list-actions button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .cat-edit-btn { background: rgba(201,149,60,0.12); color: var(--accent); }
        .cat-edit-btn:hover { background: rgba(201,149,60,0.22); }
        .cat-del-btn { background: rgba(185,28,28,0.1); color: var(--danger); }
        .cat-del-btn:hover { background: rgba(185,28,28,0.2); }
        .cat-list-item.edit-mode { padding: 6px; }
        .cat-edit-row { display: flex; align-items: center; gap: 6px; width: 100%; }
        .cat-edit-icon {
            width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg); padding: 0 4px; flex-shrink: 0;
            font-size: 12px; color: var(--text-muted);
        }
        .cat-edit-name { flex: 1; min-width: 0; }
        .cat-edit-save, .cat-edit-cancel {
            width: 34px; height: 34px; border-radius: 6px; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background 0.2s;
        }
        .cat-edit-save svg, .cat-edit-cancel svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .cat-edit-save { background: rgba(45,138,78,0.12); color: var(--success); }
        .cat-edit-save:hover { background: rgba(45,138,78,0.22); }
        .cat-edit-cancel { background: rgba(185,28,28,0.1); color: var(--danger); }
        .cat-edit-cancel:hover { background: rgba(185,28,28,0.2); }

        .cat-add-row {
            display: flex; gap: 8px; margin-top: 16px; align-items: center;
        }
        .cat-add-icon {
            width: 44px; height: 44px; border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: var(--bg); flex-shrink: 0;
            font-size: 11px; color: var(--text-muted); padding: 0 4px;
        }
        .cat-add-name { flex: 1; min-width: 0; }
        .cat-add-btn {
            padding: 10px 18px; border-radius: var(--radius-xs); border: none;
            background: var(--accent); color: #0a0e1a;
            font-family: var(--font); font-size: 13px; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: background 0.2s;
        }
        .cat-add-btn:hover { background: #dba44a; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 300; padding: 12px 24px; border-radius: var(--radius-sm);
            font-family: var(--font); font-size: 14px; font-weight: 500;
            background: var(--accent); color: #0a0e1a;
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-brand">
                <div class="header-logo" id="headerLogo">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <div class="header-title" id="headerTitle">Men&uuml;</div>
            </div>
            <div class="badge">
                <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                QR Men&uuml;
            </div>
        </div>
    </header>

    <section class="hero">
        <h1><span id="restaurantName">The Prime Steakhouse</span></h1>
        <p id="restaurantDesc">Premium et deneyimi</p>
    </section>

    <div class="menu" id="menu"></div>

    <footer class="footer">
        <div class="footer-info">
            <a href="https://maps.google.com" target="_blank" id="footerAddress">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <span id="footerAddressText">Adres girin</span>
            </a>
            <a href="tel:" id="footerPhone">

                var isCollapsed = collapsedCats[cat.id] === true;

                var section = document.createElement('div');
                section.className = 'category-section' + (isCollapsed ? ' collapsed' : '');

                var header = document.createElement('div');

                    var tagsHtml = '';
                    (item.tags || []).forEach(function (t) {
                        var tagSvg = TAG_SVG[t] || '';

                        else if (t === 'vegan') tagsHtml += '<span class="tag tag-vegan">' + tagSvg + ' Vegan</span>';

                    var ctrls = '';
                    if (isAdmin) {
                        ctrls = '<div class="admin-controls">' +

                            '<button class="del-btn" onclick="deleteItem(' + item.id + ')" title="Sil">' + SVG.trash + '</button>' +

                    var imgHtml = getIconSvg(item.icon || 'circle');

                                '<div class="menu-item-price">' + item.price + '&#x20BA;</div>' +
                            '</div>' +
                            (item.desc ? '<div class="menu-item-desc">' + escHtml(item.desc) + '</div>' : '') +
                            (tagsHtml ? '<div class="menu-item-tags">' + tagsHtml + '</div>' : '') +
                        '</div>';

                    itemsContainer.appendChild(div);
                });

                section.appendChild(header);
                section.appendChild(itemsContainer);
                el.appendChild(section);
            });
        }

        function toggleCategory(id) {
            if (collapsedCats[id]) delete collapsedCats[id];
            else collapsedCats[id] = true;
            renderAccordion();
        }

        function renderAll() {
            var rd = data.restaurant || 'The Prime Steakhouse';
            document.getElementById('restaurantName').textContent = rd;
            document.getElementById('headerTitle').textContent = rd;
            document.getElementById('restaurantDesc').textContent = data.desc || '';

            var addrEl = document.getElementById('footerAddress');
            var addrText = document.getElementById('footerAddressText');
            var phoneEl = document.getElementById('footerPhone');
            var phoneText = document.getElementById('footerPhoneText');

            addrText.textContent = data.address || 'Adres girin';
            addrEl.href = 'https://maps.google.com?q=' + encodeURIComponent(data.address || '');
            phoneText.textContent = data.phone || 'Telefon girin';
            phoneEl.href = 'tel:' + (data.phone || '');
            document.getElementById('footerCopy').textContent = '\u00A9 ' + rd;

            var social = document.getElementById('footerSocial');
            social.innerHTML = '';
            if (data.instagram && data.instagram !== '#') {
                var a = document.createElement('a');
                a.href = data.instagram; a.target = '_blank'; a.title = 'Instagram';
                a.innerHTML = SVG.instagram;
                social.appendChild(a);
            }
            if (data.whatsapp && data.whatsapp !== '#') {
                var a = document.createElement('a');
                a.href = data.whatsapp; a.target = '_blank'; a.title = 'WhatsApp';
                a.innerHTML = SVG.whatsapp;
                social.appendChild(a);
            }
            if (data.address) {
                var a = document.createElement('a');
                a.href = 'https://maps.google.com?q=' + encodeURIComponent(data.address);
                a.target = '_blank'; a.title = 'Konum';
                a.innerHTML = SVG['map-pin'];
                social.appendChild(a);
            }

            renderAccordion();
        }

        // ─── MODAL ──────────────────────────────────────────
        function populateCatSelect() {
            var sel = document.getElementById('fieldCat');
            sel.innerHTML = '';
            data.categories.forEach(function (c) {
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.label;
                sel.appendChild(opt);
            });
        }

        function setPhotoPreview(src) {
            var wrap = document.getElementById('photoPreview');
            if (src) {
                wrap.innerHTML = '<img src="' + src + '" />';
                document.getElementById('clearPhoto').style.display = 'inline-block';
            } else {
                wrap.innerHTML = SVG.camera;
                document.getElementById('clearPhoto').style.display = 'none';
            }
        }

        function clearPhoto() {
            tempPhoto = '';
            setPhotoPreview('');
            document.getElementById('photoInput').value = '';
        }

        document.getElementById('photoInput').addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (ev) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var max = 400;
                    var w = img.width, h = img.height;
                    if (w > h) { if (w > max) { h *= max / w; w = max; } }
                    else { if (h > max) { w *= max / h; h = max; } }
                    canvas.width = w; canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    tempPhoto = canvas.toDataURL('image/jpeg', 0.8);
                    setPhotoPreview(tempPhoto);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        function openAddModal() {
            editingId = null; tempPhoto = '';
            document.getElementById('modalTitle').textContent = 'Urun Ekle';
            document.getElementById('fieldName').value = '';
            document.getElementById('fieldDesc').value = '';
            document.getElementById('fieldPrice').value = '';
            document.getElementById('fieldEmoji').value = 'steak';
            populateCatSelect();
            document.getElementById('fieldCat').value = data.categories[0]?.id || '';
            document.getElementById('fieldTags').selectedIndex = -1;
            setPhotoPreview('');
            document.getElementById('photoInput').value = '';
            document.getElementById('saveBtn').innerHTML = SVG.check + ' Ekle';
            document.getElementById('saveBtn').onclick = saveItem;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function openEditModal(id) {
            var item = data.items.find(function (i) { return i.id === id; });
            if (!item) return;
            editingId = id; tempPhoto = '';
            document.getElementById('modalTitle').textContent = 'Urun Duzenle';
            document.getElementById('fieldName').value = item.name;
            document.getElementById('fieldDesc').value = item.desc || '';
            document.getElementById('fieldPrice').value = item.price;
            document.getElementById('fieldEmoji').value = item.icon || 'circle';
            populateCatSelect();
            document.getElementById('fieldCat').value = item.cat;
            var sel = document.getElementById('fieldTags');
            for (var i = 0; i < sel.options.length; i++) {
                sel.options[i].selected = (item.tags || []).indexOf(sel.options[i].value) !== -1;
            }
            if (item.photo) { tempPhoto = item.photo; setPhotoPreview(item.photo); }
            else setPhotoPreview('');
            document.getElementById('saveBtn').innerHTML = SVG.check + ' Kaydet';
            document.getElementById('saveBtn').onclick = saveItem;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        function saveItem() {
            var name = document.getElementById('fieldName').value.trim();
            var desc = document.getElementById('fieldDesc').value.trim();
            var price = parseFloat(document.getElementById('fieldPrice').value);
            var cat = document.getElementById('fieldCat').value;
            var icon = document.getElementById('fieldEmoji').value;
            var sel = document.getElementById('fieldTags');
            var tags = [];
            for (var i = 0; i < sel.options.length; i++) {
                if (sel.options[i].selected) tags.push(sel.options[i].value);
            }

            if (!name || isNaN(price)) { showToast('Urun adi ve fiyat zorunludur'); return; }

            if (editingId) {
                var item = data.items.find(function (i) { return i.id === editingId; });
                if (item) {
                    item.name = name;
                    item.desc = desc;
                    item.price = price;
                    item.cat = cat;
                    item.icon = icon;
                    item.tags = tags;
                    if (tempPhoto) item.photo = tempPhoto;
                }
                showToast('Urun guncellendi');
            } else {
                var maxId = 0;
                data.items.forEach(function (i) { if (i.id > maxId) maxId = i.id; });
                data.items.push({ id: maxId + 1, name: name, desc: desc, price: price, cat: cat, icon: icon, tags: tags, photo: tempPhoto || '' });
                showToast('Urun eklendi');
            }

            saveData();
            closeModal();
            renderAccordion();
        }

        function deleteItem(id) {
            if (!confirm('Bu urunu silmek istediginize emin misiniz?')) return;
            data.items = data.items.filter(function (i) { return i.id !== id; });
            saveData();
            renderAccordion();
            showToast('Urun silindi');
        }

        // ─── CATEGORY MODAL ─────────────────────────────────
        var editingCatId = null;

        function openCatModal() {
            editingCatId = null;
            document.getElementById('catIconInput').value = 'circle';
            document.getElementById('catNameInput').value = '';
            renderCatList();
            document.getElementById('catModalOverlay').classList.add('open');
        }

        function closeCatModal() {
            editingCatId = null;
            document.getElementById('catModalOverlay').classList.remove('open');
        }

        function renderCatList() {
            var el = document.getElementById('catList');
            el.innerHTML = '';
            data.categories.forEach(function (c) {
                var count = data.items.filter(function (i) { return i.cat === c.id; }).length;
                var div = document.createElement('div');
                div.className = 'cat-list-item' + (editingCatId === c.id ? ' edit-mode' : '');
                div.dataset.catId = c.id;

                if (editingCatId === c.id) {
                    div.innerHTML = '' +
                        '<div class="cat-edit-row">' +
                            '<select class="cat-edit-icon" id="catEditIcon">' +
                                '<option value="circle"' + (c.icon==='circle'?' selected':'') + '>Circle</option>' +
                                '<option value="diamond"' + (c.icon==='diamond'?' selected':'') + '>Diamond</option>' +
                                '<option value="grid"' + (c.icon==='grid'?' selected':'') + '>Grid</option>' +
                                '<option value="wine"' + (c.icon==='wine'?' selected':'') + '>Wine</option>' +
                                '<option value="dessert"' + (c.icon==='dessert'?' selected':'') + '>Dessert</option>' +
                                '<option value="glass"' + (c.icon==='glass'?' selected':'') + '>Glass</option>' +
                                '<option value="steak"' + (c.icon==='steak'?' selected':'') + '>Steak</option>' +
                                '<option value="leaf"' + (c.icon==='leaf'?' selected':'') + '>Leaf</option>' +
                                '<option value="star"' + (c.icon==='star'?' selected':'') + '>Star</option>' +
                                '<option value="flame"' + (c.icon==='flame'?' selected':'') + '>Flame</option>' +
                                '<option value="utensils"' + (c.icon==='utensils'?' selected':'') + '>Utensils</option>' +
                                '<option value="chef"' + (c.icon==='chef'?' selected':'') + '>Chef</option>' +
                            '</select>' +
                            '<input class="cat-edit-name" id="catEditName" value="' + escHtml(c.label) + '" />' +
                            '<button class="cat-edit-save" onclick="saveCatEdit()" title="Kaydet">' + SVG.check + '</button>' +
                            '<button class="cat-edit-cancel" onclick="cancelCatEdit()" title="Iptal">' + SVG.x + '</button>' +
                        '</div>';
                } else {
                    div.innerHTML = '' +
                        '<div class="cat-list-info">' +
                            '<span class="cat-list-icon">' + getIconSvg(c.icon) + '</span>' +
                            '<div>' +
                                '<div class="cat-list-name">' + escHtml(c.label) + '</div>' +
                                '<div class="cat-list-count">' + count + ' urun</div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="cat-list-actions">' +
                            '<button class="cat-edit-btn" onclick="editCat(\'' + c.id + '\')" title="Duzenle">' + SVG.pencil + '</button>' +
                            '<button class="cat-del-btn" onclick="deleteCat(\'' + c.id + '\')" title="Sil">' + SVG.trash + '</button>' +
                        '</div>';
                }

                el.appendChild(div);
            });
        }

        function editCat(id) {
            editingCatId = id;
            renderCatList();
        }

        function saveCatEdit() {
            var icon = document.getElementById('catEditIcon').value;
            var name = document.getElementById('catEditName').value.trim();
            if (!name) { showToast('Isim gerekli'); return; }

            var cat = data.categories.find(function (c) { return c.id === editingCatId; });
            if (cat) { cat.icon = icon; cat.label = name; }
            editingCatId = null;
            saveData();
            renderCatList();
            renderAccordion();
            showToast('Kategori guncellendi');
        }

        function cancelCatEdit() {
            editingCatId = null;
            renderCatList();
        }

        function saveCategory() {
            var icon = document.getElementById('catIconInput').value;
            var name = document.getElementById('catNameInput').value.trim();
            if (!name) { showToast('Isim gerekli'); return; }

            var id = slugify(name);
            if (data.categories.find(function (c) { return c.id === id; })) {
                var suffix = 1;
                while (data.categories.find(function (c) { return c.id === id + '-' + suffix; })) suffix++;
                id = id + '-' + suffix;
            }
            data.categories.push({ id: id, label: name, icon: icon });
            collapsedCats[id] = true;

            document.getElementById('catIconInput').value = 'circle';
            document.getElementById('catNameInput').value = '';
            saveData();
            renderCatList();
            renderAccordion();
            showToast('Kategori eklendi');
        }

        function deleteCat(id) {
            var count = data.items.filter(function (i) { return i.cat === id; }).length;
            if (count > 0) {
                showToast('Bu kategoride ' + count + ' urun var, once urunleri tasiyin');
                return;
            }
            var cat = data.categories.find(function (c) { return c.id === id; });
            if (!cat) return;
            if (!confirm('"' + cat.label + '" kategorisini silmek istediginize emin misiniz?')) return;
            data.categories = data.categories.filter(function (c) { return c.id !== id; });
            delete collapsedCats[id];
            saveData();
            renderCatList();
            renderAccordion();
            showToast('Kategori silindi');
        }

        function escHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function slugify(str) {
            return str.toLowerCase()
                .replace(/[ı]/g, 'i').replace(/[ğ]/g, 'g').replace(/[ü]/g, 'u')
                .replace(/[ş]/g, 's').replace(/[ö]/g, 'o').replace(/[ç]/g, 'c')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        // ─── SETTINGS ───────────────────────────────────────
        function openSettings() {
            var name = prompt('Restoran adi:', data.restaurant);
            if (name !== null && name.trim()) data.restaurant = name.trim();
            var desc = prompt('Aciklama (kisa):', data.desc);
            if (desc !== null) data.desc = desc.trim();
            var addr = prompt('Adres:', data.address);
            if (addr !== null) data.address = addr.trim();
            var phone = prompt('Telefon:', data.phone);
            if (phone !== null) data.phone = phone.trim();
            var insta = prompt('Instagram linki:', data.instagram);
            if (insta !== null) data.instagram = insta.trim();
            var wp = prompt('WhatsApp linki:', data.whatsapp);
            if (wp !== null) data.whatsapp = wp.trim();
            saveData();
            renderAll();
            showToast('Ayarlar kaydedildi');
        }

        // ─── LONG PRESS (admin gizli giris) ────────────────
        (function () {
            var el = document.getElementById('restaurantName');
            if (!el) return;
            var timer = null;
            var HOLD_MS = 3000;

            function start(e) {
                if (isAdmin) return;
                el.classList.add('long-press');
                timer = setTimeout(function () {
                    timer = null;
                    window.location.search = 'admin=' + ADMIN_PASSWORD;
                }, HOLD_MS);
            }

            function cancel() {
                el.classList.remove('long-press');
                if (timer) { clearTimeout(timer); timer = null; }
            }

            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', cancel);
            el.addEventListener('mouseleave', cancel);
            el.addEventListener('touchstart', start, { passive: true });
            el.addEventListener('touchend', cancel);
            el.addEventListener('touchcancel', cancel);
        })();

        // ─── INIT ───────────────────────────────────────────
        loadData();
        data.categories.forEach(function (c) { collapsedCats[c.id] = true; });
        renderAll();

        document.getElementById('modalOverlay').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('catModalOverlay').addEventListener('click', function (e) {
            if (e.target === this) closeCatModal();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { closeModal(); closeCatModal(); }
        });
    </script>
</body>
</html>
