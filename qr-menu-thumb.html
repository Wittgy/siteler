<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Menü Thumbnail</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e7e5e4; font-family: 'Segoe UI', sans-serif; }
        .design {
            width: 800px; height: 600px; position: relative; overflow: hidden;
            background: linear-gradient(135deg, #faf8f5 0%, #f5f0eb 50%, #fef3c7 100%);
            padding: 40px;
        }
        .mock-phone {
            width: 280px; height: 520px; border-radius: 32px;
            background: #ffffff; border: 2px solid rgba(0,0,0,0.06);
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            float: right; padding: 16px; margin-top: 10px;
            position: relative;
        }
        .mock-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
        }
        .mock-header .dot {
            width: 20px; height: 20px; border-radius: 6px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
        }
        .mock-header .line { width: 60px; height: 6px; background: #d97706; border-radius: 3px; }
        .mock-cats { display: flex; gap: 6px; margin-bottom: 14px; }
        .mock-cats span {
            padding: 4px 12px; border-radius: 100px; font-size: 10px;
            background: #f5f0eb; color: #78716c;
        }
        .mock-cats span.active { background: #fef3c7; color: #d97706; font-weight: 600; }
        .mock-items { display: flex; flex-direction: column; gap: 8px; }
        .mock-item {
            display: flex; gap: 10px; padding: 10px; border-radius: 10px;
            background: #faf8f5; border: 1px solid rgba(0,0,0,0.04);
        }
        .mock-item .thumb {
            width: 40px; height: 40px; border-radius: 8px;
            background: #fef3c7; flex-shrink: 0;
        }
        .mock-item .info { flex: 1; }
        .mock-item .info .title { width: 80px; height: 8px; background: #d6d3d1; border-radius: 4px; margin-bottom: 5px; }
        .mock-item .info .sub { width: 50px; height: 6px; background: #e7e5e4; border-radius: 3px; }
        .mock-item .price { font-size: 12px; font-weight: 700; color: #d97706; }
        .left-content { float: left; width: 380px; padding-top: 50px; }
        .left-content .badge {
            display: inline-block; padding: 6px 14px; border-radius: 100px;
            background: rgba(217, 119, 6, 0.1); color: #d97706;
            font-size: 12px; font-weight: 600; margin-bottom: 12px;
        }
        .left-content h1 {
            font-size: 42px; font-weight: 800; color: #1c1917; letter-spacing: -1px; line-height: 1.1;
        }
        .left-content h1 span { background: linear-gradient(135deg, #d97706, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .left-content p { color: #78716c; font-size: 16px; margin-top: 10px; line-height: 1.6; }
        .left-content .feature-list { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
        .left-content .feature {
            display: flex; align-items: center; gap: 10px; font-size: 14px; color: #1c1917;
        }
        .left-content .feature .icon {
            width: 28px; height: 28px; border-radius: 8px;
            background: rgba(217, 119, 6, 0.1); color: #d97706;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .clear { clear: both; }

        /* controls */
        .controls { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 12px; align-items: center; }
        .btn-download { display: flex; align-items: center; gap: 10px; padding: 14px 32px; border: none; border-radius: 12px; background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff; font-family: 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 24px rgba(217, 119, 6, 0.4); }
        .btn-download:hover { transform: translateY(-2px); }
        .btn-download.loading { pointer-events: none; opacity: 0.7; }
        .btn-download.success { background: linear-gradient(135deg, #059669, #10b981); }
        .btn-download .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
        .btn-download.loading .spinner { display: block; }
        .btn-download.loading .btn-label { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .zoom-control { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.06); border-radius: 10px; padding: 6px 8px; }
        .zoom-control button { width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: #78716c; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: inherit; }
        .zoom-control button:hover { background: rgba(217, 119, 6, 0.1); color: #d97706; }
        .zoom-control .zoom-label { color: #78716c; font-family: 'Segoe UI', sans-serif; font-size: 13px; min-width: 36px; text-align: center; user-select: none; }
    </style>
</head>
<body>
    <div class="design" id="design">
        <div class="left-content">
            <div class="badge">📱 Dijital Menü</div>
            <h1>QR <span>Menü</span></h1>
            <p>Restoranınız için profesyonel<br/>dijital menü çözümü</p>
            <div class="feature-list">
                <div class="feature"><span class="icon">📸</span> Fotoğraflı ürünler</div>
                <div class="feature"><span class="icon">🔧</span> Admin paneli</div>
                <div class="feature"><span class="icon">📱</span> Mobil uyumlu</div>
                <div class="feature"><span class="icon">⚡</span> Anlık güncelleme</div>
            </div>
        </div>
        <div class="mock-phone">
            <div class="mock-header">
                <div class="dot"></div>
                <div class="line"></div>
            </div>
            <div class="mock-cats">
                <span class="active">🥐 Kahvaltı</span>
                <span>🥩 Ana Yemek</span>
                <span>🥤 İçecek</span>
            </div>
            <div class="mock-items">
                <div class="mock-item">
                    <div class="thumb"></div>
                    <div class="info"><div class="title"></div><div class="sub"></div></div>
                    <div class="price">120₺</div>
                </div>
                <div class="mock-item">
                    <div class="thumb"></div>
                    <div class="info"><div class="title"></div><div class="sub"></div></div>
                    <div class="price">280₺</div>
                </div>
                <div class="mock-item">
                    <div class="thumb"></div>
                    <div class="info"><div class="title"></div><div class="sub"></div></div>
                    <div class="price">95₺</div>
                </div>
                <div class="mock-item">
                    <div class="thumb"></div>
                    <div class="info"><div class="title"></div><div class="sub"></div></div>
                    <div class="price">140₺</div>
                </div>
                <div class="mock-item">
                    <div class="thumb"></div>
                    <div class="info"><div class="title"></div><div class="sub"></div></div>
                    <div class="price">85₺</div>
                </div>
            </div>
        </div>
        <div class="clear"></div>
    </div>

    <div class="controls">
        <div class="zoom-control">
            <button id="zoomOut">−</button>
            <span class="zoom-label" id="zoomLabel">100%</span>
            <button id="zoomIn">+</button>
        </div>
        <button class="btn-download" id="btnDownload">
            <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <span class="btn-label">İndir</span>
            <span class="spinner"></span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script>
        (function () {
            var el = document.getElementById('design');
            var btn = document.getElementById('btnDownload');
            var zoomIn = document.getElementById('zoomIn');
            var zoomOut = document.getElementById('zoomOut');
            var zoomLabel = document.getElementById('zoomLabel');
            if (!el || !btn) return;
            var scale = 1, MIN = 0.25, MAX = 2;
            var W = 800, H = 600;
            function updateZoom() { el.style.transform = 'scale(' + scale + ')'; el.style.transformOrigin = 'top left'; document.body.style.minHeight = (H * scale + 120) + 'px'; zoomLabel.textContent = Math.round(scale * 100) + '%'; }
            if (zoomIn) zoomIn.addEventListener('click', function () { scale = Math.min(MAX, +(scale + 0.1).toFixed(1)); updateZoom(); });
            if (zoomOut) zoomOut.addEventListener('click', function () { scale = Math.max(MIN, +(scale - 0.1).toFixed(1)); updateZoom(); });
            btn.addEventListener('click', async function () {
                btn.classList.add('loading');
                try {
                    var canvas = await html2canvas(el, { scale: 1, useCORS: true, backgroundColor: null, width: W, height: H, logging: false });
                    var link = document.createElement('a'); link.download = 'qr-menu-thumb.png'; link.href = canvas.toDataURL('image/png'); link.click();
                    btn.classList.remove('loading'); btn.classList.add('success'); btn.querySelector('.btn-label').textContent = 'Tamam!';
                    setTimeout(function () { btn.classList.remove('success'); btn.querySelector('.btn-label').textContent = 'İndir'; }, 2000);
                } catch (err) { console.error(err); btn.classList.remove('loading'); btn.querySelector('.btn-label').textContent = 'Hata!'; setTimeout(function () { btn.querySelector('.btn-label').textContent = 'İndir'; }, 2000); }
            });
        })();
    </script>
<footer style="text-align:center;padding:20px;font-size:12px;color:#666;font-family:'Inter',sans-serif">
  <p style="margin:0">Burak Biçer Tasarım Atlası · <a href="https://www.instagram.com/captainbicer/" target="_blank" style="color:#666;text-decoration:underline">@captainbicer</a></p>
</footer>
</body>
</html>
