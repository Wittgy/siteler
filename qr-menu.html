<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>QR Menü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #faf8f5;
            --surface: #ffffff;
            --surface-hover: #f5f3f0;
            --text: #1c1917;
            --text-muted: #78716c;
            --accent: #d97706;
            --accent-hover: #b45309;
            --accent-subtle: rgba(217, 119, 6, 0.1);
            --accent-light: #fef3c7;
            --border: rgba(0, 0, 0, 0.06);
            --border-hover: rgba(0, 0, 0, 0.12);
            --radius: 14px;
            --radius-sm: 10px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --pop: #dc2626;
            --vegan: #16a34a;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.06);
        }

        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* HEADER */
        .header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
        }
        .header-inner {
            max-width: 960px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between;
        }
        .header-brand { display: flex; align-items: center; gap: 12px; }
        .header-logo {
            width: 40px; height: 40px; border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .header-title { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
        .header-title span { color: var(--text-muted); font-weight: 400; }
        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 100px; font-size: 12px; font-weight: 600;
            background: var(--accent-subtle); color: var(--accent);
            border: 1px solid rgba(217, 119, 6, 0.2); flex-shrink: 0;
        }
        .badge svg { width: 14px; height: 14px; }

        /* HERO */
        .hero { max-width: 960px; margin: 0 auto; padding: 28px 20px 20px; text-align: center; }
        .hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; color: var(--text); }
        .hero h1 span {
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }
        .hero h1 span.long-press {
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .hero p { color: var(--text-muted); font-size: 14px; }

        /* MENU ACCORDION */
        .menu { max-width: 960px; margin: 0 auto; padding: 4px 20px 20px; }

        .category-section {
            margin-bottom: 8px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            scroll-margin-top: 80px;
        }
        .category-section:target {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-subtle);
        }

        .category-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s;
            position: sticky;
            top: 69px;
            z-index: 20;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .category-header:hover { background: var(--surface-hover); }
        .category-section.collapsed .category-header { border-bottom-color: transparent; }
        .category-header-left { display: flex; align-items: center; gap: 10px; }
        .category-header-icon { font-size: 20px; }
        .category-header-name { font-size: 16px; font-weight: 700; color: var(--text); }
        .category-header-count {
            font-size: 12px; color: var(--text-muted);
            background: var(--bg); padding: 2px 10px; border-radius: 100px;
            font-weight: 500;
        }
        .category-header-toggle {
            font-size: 16px; color: var(--text-muted);
            transition: transform 0.3s ease;
        }
        .category-section.collapsed .category-header-toggle {
            transform: rotate(-90deg);
        }

        .category-items {
            display: grid; grid-template-columns: 1fr; gap: 6px;
            padding: 8px 12px 12px;
        }
        .category-section.collapsed .category-items { display: none; }

        .menu-item {
            display: flex; gap: 12px; padding: 12px;
            border-radius: var(--radius-sm); background: var(--bg);
            border: 1px solid transparent;
            transition: all 0.25s ease;
            position: relative;
            animation: fadeIn 0.3s ease both;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .menu-item:hover { border-color: var(--border); }
        .menu-item-img {
            width: 64px; height: 64px; border-radius: 8px;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 24px; background: var(--surface); overflow: hidden;
        }
        .menu-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .menu-item-body { flex: 1; min-width: 0; }
        .menu-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 1px; }
        .menu-item-name { font-size: 14px; font-weight: 600; color: var(--text); }
        .menu-item-price { font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
        .menu-item-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-bottom: 5px; }
        .menu-item-tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 9px; border-radius: 100px;
            font-size: 10px; font-weight: 600; letter-spacing: 0.2px;
        }
        .tag-pop { background: rgba(220, 38, 38, 0.08); color: var(--pop); }
        .tag-vegan { background: rgba(22, 163, 74, 0.08); color: var(--vegan); }
        .tag-new { background: rgba(217, 119, 6, 0.1); color: var(--accent); }

        /* FOOTER */
        .footer { max-width: 960px; margin: 40px auto 0; padding: 24px 20px; border-top: 1px solid var(--border); text-align: center; position: relative; }
        .footer-info { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
        .footer-info a { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .footer-info a:hover { color: var(--accent); }
        .footer-social { display: flex; justify-content: center; gap: 10px; }
        .footer-social a {
            width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); text-decoration: none; font-size: 16px; transition: all 0.25s ease;
        }
        .footer-social a:hover { border-color: var(--accent); color: var(--accent); }
        .footer-copy { margin-top: 14px; font-size: 12px; color: rgba(120, 113, 108, 0.5); }

        @media (min-width: 600px) {
            .category-items { grid-template-columns: 1fr 1fr; gap: 8px; }
            .category-header { padding: 16px 20px; }
            .category-items { padding: 10px 16px 16px; }
            .hero h1 { font-size: 32px; }
            .menu-item-img { width: 72px; height: 72px; font-size: 28px; }
        }

        /* ─── ADMIN ───────────────────────────────── */
        .admin-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: #ffffff; border-top: 2px solid var(--accent);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
            padding: 10px 16px;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
        }
        .admin-bar .info { font-size: 13px; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .admin-bar .actions { display: flex; gap: 8px; }
        .admin-btn {
            padding: 8px 16px; border-radius: 8px; border: none;
            font-family: var(--font); font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.2s;
        }
        .admin-btn-primary { background: var(--accent); color: #fff; }
        .admin-btn-primary:hover { background: var(--accent-hover); }
        .admin-btn-danger { background: rgba(220, 38, 38, 0.08); color: var(--pop); }
        .admin-btn-danger:hover { background: rgba(220, 38, 38, 0.15); }
        .admin-btn-ghost { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
        .admin-btn-ghost:hover { background: var(--surface-hover); color: var(--text); }

        .admin-controls {
            position: absolute; top: 8px; right: 8px;
            display: none; gap: 4px; z-index: 5;
        }
        .admin-controls button {
            width: 30px; height: 30px; border-radius: 6px;
            border: none; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .admin-controls .edit-btn { background: rgba(217, 119, 6, 0.1); color: var(--accent); }
        .admin-controls .edit-btn:hover { background: rgba(217, 119, 6, 0.2); }
        .admin-controls .del-btn { background: rgba(220, 38, 38, 0.08); color: var(--pop); }
        .admin-controls .del-btn:hover { background: rgba(220, 38, 38, 0.15); }
        .admin-on .category-items { padding-right: 4px; }
        .admin-on .admin-controls { display: flex; }
        /* MODAL */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
            background: #ffffff; border-radius: var(--radius) var(--radius) 0 0;
            padding: 24px 20px 28px;
            animation: modalUp 0.3s ease;
        }
        @keyframes modalUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text); }
        .modal label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; margin-top: 14px; }
        .modal label:first-of-type { margin-top: 0; }
        .modal input, .modal select, .modal textarea {
            width: 100%; padding: 10px 14px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-family: var(--font); font-size: 14px;
            outline: none; transition: border 0.2s;
        }
        .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
        .modal textarea { resize: vertical; min-height: 60px; }
        .modal .row { display: flex; gap: 12px; }
        .modal .row > * { flex: 1; }
        .modal .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
        .modal .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .modal .modal-actions .save-btn { background: var(--accent); color: #fff; }
        .modal .modal-actions .save-btn:hover { background: var(--accent-hover); }
        .modal .modal-actions .cancel-btn { background: var(--bg); color: var(--text-muted); }
        .modal .modal-actions .cancel-btn:hover { background: var(--surface-hover); color: var(--text); }

        /* fotoğraf yükleme */
        .photo-upload { margin-top: 14px; }
        .photo-upload .preview-wrap {
            display: flex; align-items: center; gap: 12px; margin-top: 8px;
        }
        .photo-upload .preview {
            width: 72px; height: 72px; border-radius: var(--radius-sm);
            background: var(--bg); overflow: hidden; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; flex-shrink: 0;
        }
        .photo-upload .preview img { width: 100%; height: 100%; object-fit: cover; }
        .photo-upload .upload-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text-muted); font-family: var(--font);
            font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .photo-upload .upload-btn:hover { border-color: var(--border-hover); color: var(--text); }
        .photo-upload .clear-btn {
            padding: 6px 12px; border-radius: 6px; border: none;
            background: rgba(220, 38, 38, 0.08); color: var(--pop);
            font-family: var(--font); font-size: 12px; cursor: pointer;
        }

        @media (min-width: 600px) {
            .modal-overlay { align-items: center; }
            .modal { border-radius: var(--radius); }
        }

        /* CATEGORY MODAL */
        .cat-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
        .cat-list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; border-radius: 8px;
            background: var(--bg); border: 1px solid var(--border);
        }
        .cat-list-info { display: flex; align-items: center; gap: 10px; }
        .cat-list-icon { font-size: 20px; width: 28px; text-align: center; }
        .cat-list-name { font-size: 14px; font-weight: 600; color: var(--text); }
        .cat-list-count { font-size: 11px; color: var(--text-muted); }
        .cat-list-actions { display: flex; gap: 4px; }
        .cat-list-actions button {
            width: 30px; height: 30px; border-radius: 6px; border: none; cursor: pointer;
            font-size: 14px; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .cat-edit-btn { background: rgba(217, 119, 6, 0.1); color: var(--accent); }
        .cat-edit-btn:hover { background: rgba(217, 119, 6, 0.2); }
        .cat-del-btn { background: rgba(220, 38, 38, 0.08); color: var(--pop); }
        .cat-del-btn:hover { background: rgba(220, 38, 38, 0.15); }
        .cat-list-item.edit-mode { padding: 6px; }
        .cat-edit-row { display: flex; align-items: center; gap: 6px; width: 100%; }
        .cat-edit-icon {
            width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg); font-size: 18px; text-align: center; padding: 0; flex-shrink: 0;
        }
        .cat-edit-name { flex: 1; min-width: 0; }
        .cat-edit-save, .cat-edit-cancel {
            width: 34px; height: 34px; border-radius: 6px; border: none; cursor: pointer;
            font-size: 15px; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background 0.2s;
        }
        .cat-edit-save { background: rgba(22, 163, 74, 0.1); }
        .cat-edit-save:hover { background: rgba(22, 163, 74, 0.2); }
        .cat-edit-cancel { background: rgba(220, 38, 38, 0.08); }
        .cat-edit-cancel:hover { background: rgba(220, 38, 38, 0.15); }

        .cat-add-row {
            display: flex; gap: 8px; margin-top: 16px; align-items: center;
        }
        .cat-add-row .cat-add-icon {
            width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); font-size: 20px; text-align: center; flex-shrink: 0;
            padding: 0;
        }
        .cat-add-name { flex: 1; min-width: 0; }
        .cat-add-btn {
            padding: 10px 18px; border-radius: 8px; border: none; background: var(--accent);
            color: #fff; font-family: var(--font); font-size: 13px; font-weight: 600;
            cursor: pointer; white-space: nowrap; transition: background 0.2s;
        }
        .cat-add-btn:hover { background: var(--accent-hover); }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 300; padding: 12px 24px; border-radius: 10px;
            font-family: var(--font); font-size: 14px; font-weight: 500;
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <header class="header">
        <div class="header-inner">
            <div class="header-brand">
                <div class="header-logo" id="headerLogo">🍽️</div>
                <div class="header-title" id="headerTitle">Menü</div>
            </div>
            <div class="badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                QR Menü
            </div>
        </div>
    </header>

    <section class="hero">
        <h1><span id="restaurantName">Restoran Adı</span></h1>
        <p id="restaurantDesc">Lezzetlerimizi keşfedin</p>
    </section>

    <div class="menu" id="menu"></div>

    <footer class="footer">
        <div class="footer-info">
            <a href="https://maps.google.com" target="_blank" id="footerAddress">📍 Adres girin</a>
            <a href="tel:" id="footerPhone">📞 Telefon girin</a>
        </div>
        <div class="footer-social" id="footerSocial"></div>
        <div class="footer-copy" id="footerCopy">© QR Menü</div>

    </footer>

    <!-- MODAL (ürün) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Ürün Ekle</h2>
            <label>Ürün Adı</label>
            <input id="fieldName" />
            <label>Açıklama</label>
            <textarea id="fieldDesc"></textarea>
            <div class="row">
                <div>
                    <label>Fiyat (₺)</label>
                    <input type="number" id="fieldPrice" />
                </div>
                <div>
                    <label>Kategori</label>
                    <select id="fieldCat"></select>
                </div>
            </div>
            <div class="row">
                <div>
                    <label>Emoji</label>
                    <input id="fieldEmoji" placeholder="🍕" />
                </div>
                <div>
                    <label>Etiketler</label>
                    <select id="fieldTags" multiple style="height:80px">
                        <option value="pop">🔥 Popüler</option>
                        <option value="vegan">🌿 Vegan</option>
                        <option value="new">✨ Yeni</option>
                    </select>
                </div>
            </div>
            <div class="photo-upload">
                <label>📸 Fotoğraf</label>
                <div class="preview-wrap">
                    <div class="preview" id="photoPreview">🍽️</div>
                    <div>
                        <button class="upload-btn" onclick="document.getElementById('photoInput').click()">📁 Fotoğraf Seç</button>
                        <button class="clear-btn" id="clearPhoto" style="display:none" onclick="clearPhoto()">Kaldır</button>
                    </div>
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display:none" />
            </div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeModal()">İptal</button>
                <button class="save-btn" id="saveBtn">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- MODAL (kategori) -->
    <div class="modal-overlay" id="catModalOverlay">
        <div class="modal">
            <h2>📁 Kategoriler</h2>
            <div class="cat-list" id="catList"></div>
            <div class="cat-add-row">
                <input class="cat-add-icon" id="catIconInput" value="🥐" maxlength="2" />
                <input class="cat-add-name" id="catNameInput" placeholder="Kategori adı" />
                <button class="cat-add-btn" id="catSaveBtn" onclick="saveCategory()">Ekle</button>
            </div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeCatModal()">Kapat</button>
            </div>
        </div>
    </div>

    <script>
        // ─── CONFIG ─────────────────────────────────────────
        var ADMIN_PASSWORD = '1234';

        // ─── DEFAULT DATA ───────────────────────────────────
        var defaultData = {
            restaurant: 'Lezzet Durağı',
            desc: 'Lezzetlerimizi keşfedin',
            emoji: '🍽️',
            address: 'Atatürk Cad. No:42, İstanbul',
            phone: '0555 123 45 67',
            instagram: '#',
            whatsapp: '#',
            categories: [
                { id: 'kahvalti', label: 'Kahvaltı', icon: '🥐' },
                { id: 'corba', label: 'Çorbalar', icon: '🥣' },
                { id: 'ana-yemek', label: 'Ana Yemekler', icon: '🥩' },
                { id: 'salata', label: 'Salatalar', icon: '🥗' },
                { id: 'icecek', label: 'İçecekler', icon: '🥤' },
                { id: 'tatli', label: 'Tatlılar', icon: '🍯' },
            ],
            items: [
                { id: 1, name: 'Menemen', desc: 'Yumurta, domates, biber ve özel baharatlarla', price: 120, cat: 'kahvalti', emoji: '🍳', tags: ['pop'], photo: '' },
                { id: 2, name: 'Serpme Kahvaltı', desc: 'Zeytin, peynir, bal, kaymak, reçel çeşitleri', price: 280, cat: 'kahvalti', emoji: '🧀', tags: ['pop'], photo: '' },

        // ─── RENDER ─────────────────────────────────────────
        function renderAccordion() {
            var el = document.getElementById('menu');
            el.innerHTML = '';

            data.categories.forEach(function (cat, ci) {
                var items = data.items.filter(function (item) { return item.cat === cat.id; });
                if (items.length === 0) return;

                var isCollapsed = collapsedCats[cat.id] === true;

                var section = document.createElement('div');
                section.className = 'category-section' + (isCollapsed ? ' collapsed' : '');
                section.id = 'cat-' + cat.id;

                var header = document.createElement('div');
                header.className = 'category-header';
                header.innerHTML = '' +
                    '<div class="category-header-left">' +
                        '<span class="category-header-icon">' + cat.icon + '</span>' +
                        '<span class="category-header-name">' + cat.label + '</span>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;gap:10px">' +
                        '<span class="category-header-count">' + items.length + '</span>' +
                        '<span class="category-header-toggle">▼</span>' +
                    '</div>';

                header.addEventListener('click', function () {
                    toggleCategory(cat.id);
                });

                var itemsContainer = document.createElement('div');
                itemsContainer.className = 'category-items';

                items.forEach(function (item, i) {
                    var div = document.createElement('div');
                    div.className = 'menu-item';
                    div.style.animationDelay = (i * 0.04) + 's';
                    div.dataset.id = item.id;

                    var tagsHtml = '';
                    (item.tags || []).forEach(function (t) {
                        if (t === 'pop') tagsHtml += '<span class="tag tag-pop">🔥 Popüler</span>';
                        else if (t === 'vegan') tagsHtml += '<span class="tag tag-vegan">🌿 Vegan</span>';
                        else if (t === 'new') tagsHtml += '<span class="tag tag-new">✨ Yeni</span>';
                    });

                    var ctrls = '';
                    if (isAdmin) {
                        ctrls = '<div class="admin-controls">' +
                            '<button class="edit-btn" onclick="openEditModal(' + item.id + ')" title="Düzenle">✏️</button>' +
                            '<button class="del-btn" onclick="deleteItem(' + item.id + ')" title="Sil">🗑️</button>' +
                        '</div>';
                    }

                    var imgHtml = item.emoji || '🍽️';
                    if (item.photo) imgHtml = '<img src="' + item.photo + '" alt="' + item.name + '" />';

                    div.innerHTML = '' +
                        ctrls +
                        '<div class="menu-item-img">' + imgHtml + '</div>' +
                        '<div class="menu-item-body">' +
                            '<div class="menu-item-header">' +
                                '<div class="menu-item-name">' + item.name + '</div>' +
                                '<div class="menu-item-price">' + item.price + '₺</div>' +

                            (tagsHtml ? '<div class="menu-item-tags">' + tagsHtml + '</div>' : '') +

                section.appendChild(header);
                section.appendChild(itemsContainer);
                el.appendChild(section);
            });

        function setPhotoPreview(src) {
            var wrap = document.getElementById('photoPreview');
            if (src) {
                wrap.innerHTML = '<img src="' + src + '" />';
                document.getElementById('clearPhoto').style.display = 'inline-block';
            } else {
                wrap.innerHTML = '🍽️';
                document.getElementById('clearPhoto').style.display = 'none';
            }
        }

        function clearPhoto() {
            tempPhoto = '';
            setPhotoPreview('');
            document.getElementById('photoInput').value = '';
        }

        document.getElementById('photoInput').addEventListener('change', function (e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function (ev) {
                var img = new Image();
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var max = 400;
                    var w = img.width, h = img.height;
                    if (w > h) { if (w > max) { h *= max / w; w = max; } }
                    else { if (h > max) { w *= max / h; h = max; } }
                    canvas.width = w; canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    tempPhoto = canvas.toDataURL('image/jpeg', 0.8);
                    setPhotoPreview(tempPhoto);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        function openEditModal(id) {
            var item = data.items.find(function (i) { return i.id === id; });
            if (!item) return;
            editingId = id; tempPhoto = '';
            document.getElementById('modalTitle').textContent = 'Ürün Düzenle';
            document.getElementById('fieldName').value = item.name;
            document.getElementById('fieldDesc').value = item.desc || '';
            document.getElementById('fieldPrice').value = item.price;
            document.getElementById('fieldEmoji').value = item.emoji || '🍽️';
            populateCatSelect();
            document.getElementById('fieldCat').value = item.cat;
            var sel = document.getElementById('fieldTags');
            for (var i = 0; i < sel.options.length; i++) {
                sel.options[i].selected = (item.tags || []).indexOf(sel.options[i].value) !== -1;
            }
            if (item.photo) { tempPhoto = item.photo; setPhotoPreview(item.photo); }
            else setPhotoPreview('');
            document.getElementById('saveBtn').textContent = 'Kaydet';
            document.getElementById('saveBtn').onclick = saveItem;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }

        function saveItem() {
            var name = document.getElementById('fieldName').value.trim();
            var desc = document.getElementById('fieldDesc').value.trim();
            var price = parseFloat(document.getElementById('fieldPrice').value);
            var cat = document.getElementById('fieldCat').value;
            var emoji = document.getElementById('fieldEmoji').value.trim() || '🍽️';
            var sel = document.getElementById('fieldTags');
            var tags = [];
            for (var i = 0; i < sel.options.length; i++) {
                if (sel.options[i].selected) tags.push(sel.options[i].value);
            }

            if (!name || isNaN(price)) { showToast('Ürün adı ve fiyat zorunludur'); return; }

            if (editingId) {
                var item = data.items.find(function (i) { return i.id === editingId; });
                if (item) {
                    item.name = name;
                    item.desc = desc;
                    item.price = price;
                    item.cat = cat;
                    item.emoji = emoji;
                    item.tags = tags;
                    if (tempPhoto) item.photo = tempPhoto;
                }
                showToast('Ürün güncellendi');
            } else {
                var maxId = 0;
                data.items.forEach(function (i) { if (i.id > maxId) maxId = i.id; });
                data.items.push({ id: maxId + 1, name: name, desc: desc, price: price, cat: cat, emoji: emoji, tags: tags, photo: tempPhoto || '' });
                showToast('Ürün eklendi');
            }

            saveData();
            closeModal();
            renderAccordion();
        }

        function deleteItem(id) {
            if (!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
            data.items = data.items.filter(function (i) { return i.id !== id; });
            saveData();
            renderAccordion();
            showToast('Ürün silindi');
        }

            var el = document.getElementById('catList');

        function saveCatEdit() {
            var icon = document.getElementById('catEditIcon').value.trim();
            var name = document.getElementById('catEditName').value.trim();
            if (!icon || !name) { showToast('Emoji ve isim gerekli'); return; }

            var cat = data.categories.find(function (c) { return c.id === editingCatId; });
            if (cat) { cat.icon = icon; cat.label = name; }
            editingCatId = null;
            saveData();
            renderCatList();
            renderAccordion();
            showToast('Kategori güncellendi');
        }

        function cancelCatEdit() {
            editingCatId = null;
            renderCatList();
        }

        function saveCategory() {
            var icon = document.getElementById('catIconInput').value.trim();
            var name = document.getElementById('catNameInput').value.trim();
            if (!icon || !name) { showToast('Emoji ve isim gerekli'); return; }

            var id = slugify(name);
            if (data.categories.find(function (c) { return c.id === id; })) {
                var suffix = 1;
                while (data.categories.find(function (c) { return c.id === id + '-' + suffix; })) suffix++;
                id = id + '-' + suffix;
            }
            data.categories.push({ id: id, label: name, icon: icon });
            collapsedCats[id] = true;

            document.getElementById('catIconInput').value = '🥐';
            document.getElementById('catNameInput').value = '';
            saveData();
            renderCatList();
            renderAccordion();
            showToast('Kategori eklendi');
        }

        function deleteCat(id) {
            var count = data.items.filter(function (i) { return i.cat === id; }).length;
            if (count > 0) {
                showToast('Bu kategoride ' + count + ' ürün var, önce ürünleri taşıyın');
                return;
            }
            var cat = data.categories.find(function (c) { return c.id === id; });
            if (!cat) return;
            if (!confirm('"' + cat.label + '" kategorisini silmek istediğinize emin misiniz?')) return;
            data.categories = data.categories.filter(function (c) { return c.id !== id; });
            delete collapsedCats[id];
            saveData();
            renderCatList();
            renderAccordion();
            showToast('Kategori silindi');
        }

        function escHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function slugify(str) {
            return str.toLowerCase()
                .replace(/[ı]/g, 'i').replace(/[ğ]/g, 'g').replace(/[ü]/g, 'u')
                .replace(/[ş]/g, 's').replace(/[ö]/g, 'o').replace(/[ç]/g, 'c')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }

        // ─── LONG PRESS (admin gizli giriş) ────────────────
        (function () {
            var el = document.getElementById('restaurantName');
            if (!el) return;
            var timer = null;
            var HOLD_MS = 3000;

            function start(e) {
                if (isAdmin) return;
                el.classList.add('long-press');
                timer = setTimeout(function () {
                    timer = null;
                    window.location.search = 'admin=' + ADMIN_PASSWORD;
                }, HOLD_MS);
            }

            function cancel() {
                el.classList.remove('long-press');
                if (timer) { clearTimeout(timer); timer = null; }
            }

            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', cancel);
            el.addEventListener('mouseleave', cancel);
            el.addEventListener('touchstart', start, { passive: true });
            el.addEventListener('touchend', cancel);
            el.addEventListener('touchcancel', cancel);
        })();

        renderAll();

        document.getElementById('modalOverlay').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('catModalOverlay').addEventListener('click', function (e) {
            if (e.target === this) closeCatModal();
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') { closeModal(); closeCatModal(); }
        });
    </script>
</body>
</html>
